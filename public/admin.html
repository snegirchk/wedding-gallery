<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Модерация · Ксения &amp; Константин</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
:root{--navy:#1d3a52;--navy-deep:#132330;--cream:#f5eee0;--paper:#fff;--ink:#333f49;--ink-soft:#6c7a84;--line:#dcd1ba;--gold:#b0895a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'EB Garamond',serif;background:var(--cream);color:var(--ink);padding:2rem 1.2rem;line-height:1.5;}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--navy);font-size:2rem;text-align:center;margin-bottom:.2rem;}
.sub{text-align:center;color:var(--ink-soft);margin-bottom:1.6rem;font-size:.95rem;}
.gate{max-width:420px;margin:2rem auto;background:var(--paper);border:1px solid var(--line);padding:1.6rem;text-align:center;}
.gate input{width:100%;padding:.7rem .9rem;border:1px solid var(--line);font-family:inherit;font-size:1rem;margin:.8rem 0;}
button{font-family:'Cormorant Garamond',serif;text-transform:uppercase;letter-spacing:.14em;font-weight:600;
  font-size:.8rem;padding:.6rem 1.4rem;background:var(--navy);color:#fff;border:none;cursor:pointer;}
button.danger{background:#a24141;}
button:disabled{opacity:.5;cursor:default;}
.stat{text-align:center;color:var(--ink-soft);margin-bottom:1.2rem;font-size:.9rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;max-width:1100px;margin:0 auto;}
.card{background:var(--paper);border:1px solid var(--line);padding:.6rem;display:flex;flex-direction:column;gap:.5rem;}
.card .ph{aspect-ratio:1/1;background:var(--cream);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.card .ph img{width:100%;height:100%;object-fit:cover;}
.card .ph .ico{font-size:2rem;}
.card .meta{font-size:.78rem;color:var(--ink-soft);word-break:break-word;}
.card .meta b{color:var(--ink);font-weight:600;}
.card a{color:var(--navy);}
.msg{text-align:center;margin:1rem auto;max-width:600px;color:#a24141;}
</style>
</head>
<body>
<h1>Модерация</h1>
<div class="sub">Ксения &amp; Константин · управление галереей</div>

<div class="gate" id="gate">
  <div>Введите секретное слово администратора</div>
  <input type="password" id="secret" placeholder="секрет" autocomplete="off">
  <button id="enter">Войти</button>
  <div class="msg" id="gateMsg"></div>
</div>

<div id="app" style="display:none">
  <div class="stat" id="stat"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const GH = { owner: "snegirchk", repo: "wedding-media", token: "%%MEDIA_TOKEN%%" };
const ADMIN_WORD = "%%ADMIN_WORD%%";
const hasToken = () => /^(github_pat_|ghp_|gho_)/.test(GH.token);
if (!hasToken()) { try { const t = localStorage.getItem("wg_token"); if (t) GH.token = t; } catch {} }
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const unb64u = (s) => { try { return decodeURIComponent(escape(atob(String(s).replace(/-/g,"+").replace(/_/g,"/")))); } catch { return ""; } };
const encPath = (p) => p.split("/").map(encodeURIComponent).join("/");
const ghHeaders = () => { const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; if (hasToken()) h["Authorization"] = "Bearer " + GH.token; return h; };

// вход: слово в поле или в адресе admin.html#слово
if (location.hash.length > 1) { $("#secret").value = decodeURIComponent(location.hash.slice(1)); tryEnter(); }
$("#enter").addEventListener("click", tryEnter);
$("#secret").addEventListener("keydown", (e) => { if (e.key === "Enter") tryEnter(); });

function tryEnter() {
  const w = $("#secret").value;
  if (ADMIN_WORD && ADMIN_WORD.indexOf("%%") === -1 && w !== ADMIN_WORD) {
    $("#gateMsg").textContent = "Неверное слово"; return;
  }
  $("#gate").style.display = "none";
  $("#app").style.display = "block";
  load();
}

async function load() {
  try {
    const br = await (await fetch(`${API}/branches/main`, { headers: ghHeaders(), cache: "no-store" })).json();
    const sha = br.commit.sha;
    const tree = await (await fetch(`${API}/git/trees/${sha}?recursive=1`, { headers: ghHeaders(), cache: "no-store" })).json();
    const blobs = (tree.tree || []).filter((x) => x.type === "blob");
    const thumbs = new Map();
    const items = [];
    for (const b of blobs) {
      let m;
      if ((m = b.path.match(/^t\/([^/]+)\.jpg$/))) { thumbs.set(m[1], b); continue; }
      if ((m = b.path.match(/^m\/([^~/]+)~([a-z]+)~([^~]*)~(.+)\.([a-z0-9]+)$/i))) {
        items.push({ id: m[1], kind: m[2], uploader: unb64u(m[3]), name: unb64u(m[4]) + "." + m[5], path: b.path, sha: b.sha });
      } else if ((m = b.path.match(/^l\/([^~/]+)~([^~]*)~(.+)\.txt$/))) {
        items.push({ id: m[1], kind: "link", uploader: unb64u(m[2]), name: unb64u(m[3]), path: b.path, sha: b.sha, url: unb64u(m[3]) });
      }
    }
    items.sort((a, b) => (a.id < b.id ? 1 : -1));
    $("#stat").textContent = `${items.length} кадров`;
    const grid = $("#grid");
    grid.innerHTML = "";
    for (const it of items) {
      const t = thumbs.get(it.id);
      const thumbUrl = t ? `https://cdn.jsdelivr.net/gh/${GH.owner}/${GH.repo}@${sha}/${encPath(t.path)}` : "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="ph">${thumbUrl ? `<img loading="lazy" src="${thumbUrl}">` : `<span class="ico">${it.kind === "video" ? "🎬" : it.kind === "link" ? "🔗" : "🖼"}</span>`}</div>
        <div class="meta"><b>${esc(it.name)}</b><br>${esc(it.uploader || "без имени")}${it.url ? `<br><a href="${esc(it.url)}" target="_blank" rel="noopener">ссылка</a>` : ""}</div>
        <button class="danger">Удалить</button>`;
      card.querySelector("button").addEventListener("click", () => del(it, t, card));
      grid.appendChild(card);
    }
  } catch (e) {
    $("#stat").textContent = "не удалось загрузить: " + (e.message || e);
  }
}

async function del(it, thumb, card) {
  if (!hasToken()) { alert("Нет токена — модерация недоступна"); return; }
  if (!confirm(`Удалить «${it.name}» навсегда?`)) return;
  const btn = card.querySelector("button");
  btn.disabled = true; btn.textContent = "…";
  const rm = async (path, sha) => fetch(`${API}/contents/${encPath(path)}`, {
    method: "DELETE", headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({ message: "moderation delete", sha, branch: "main" }),
  });
  try {
    const r = await rm(it.path, it.sha);
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (thumb) await rm(thumb.path, thumb.sha).catch(() => {});
    card.remove();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Удалить";
    alert("Не удалось удалить: " + e.message);
  }
}
</script>
</body>
</html>
